name: multidownloader
description: MultiDownloader - native Android port (no WebView, no external server). yt-dlp + ffmpeg run on-device.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.3
  provider: ^6.1.2
  crypto: ^3.0.3
  open_filex: ^4.5.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
